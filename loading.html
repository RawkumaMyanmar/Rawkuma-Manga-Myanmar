<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rawkuma | 3D Loading...</title>
    <style>
        :root {
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.6);
            --bg: #020617;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, sans-serif;
            perspective: 1000px; /* For 3D Effects */
        }

        .loading-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transform-style: preserve-3d;
        }

        /* --- 3D Glass Card --- */
        .glass-box {
            position: relative;
            width: 220px;
            height: 220px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 0 20px rgba(255, 255, 255, 0.05);
            animation: float 4s ease-in-out infinite;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotateX(5deg) rotateY(-5deg); }
            50% { transform: translateY(-20px) rotateX(-5deg) rotateY(5deg); }
        }

        /* --- Animated 3D Ring --- */
        .ring-3d {
            position: absolute;
            width: 320px;
            height: 320px;
            border: 3px solid transparent;
            border-left-color: var(--accent);
            border-right-color: var(--accent);
            border-radius: 50%;
            animation: rotate3d 2s linear infinite;
            filter: drop-shadow(0 0 15px var(--accent));
        }

        @keyframes rotate3d {
            0% { transform: rotate(0deg) rotateX(60deg); }
            100% { transform: rotate(360deg) rotateX(60deg); }
        }

        .loading-gif {
            width: 160px;
            height: 160px;
            border-radius: 30px;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 2;
        }

        /* --- 3D Brand Title --- */
        .brand-title {
            position: absolute;
            font-size: 25px;
            font-weight: 900;
            color: white;
            text-transform: uppercase;
            letter-spacing: 10px;
            opacity: 0;
            transform: translateZ(50px) scale(0.8);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
            text-shadow: 
                0 1px 0 #ccc, 
                0 2px 0 #c9c9c9,
                0 10px 20px rgba(139, 92, 246, 0.5);
        }

        /* Animation States */
        .hide-box {
            opacity: 0;
            transform: scale(0.5) translateZ(-100px);
        }

        .show-text {
            opacity: 1;
            transform: translateZ(100px) scale(1);
        }

        /* --- Status Text --- */
        .loader-text {
            margin-top: 50px;
            color: #94a3b8;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1); }
        }

        /* Ambient Light Particles */
        .glow-point {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            filter: blur(2px);
            animation: rise 3s infinite linear;
            opacity: 0;
        }

        @keyframes rise {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="particles-container"></div>

    <div class="loading-container">
        <div class="ring-3d" id="loaderRing"></div>
        
        <div class="glass-box" id="glassBox">
            <img src="https://i.ibb.co/GvW4F3gq/wallpaper.gif" alt="Loading" class="loading-gif">
        </div>
        
        <div class="brand-title" id="brandTitle">Rawkuma Channel</div>
        
        <div class="loader-text" id="statusText">System Initializing...</div>
    </div>

    <script>
        // Background Particles Generation
        const pContainer = document.getElementById('particles-container');
        for(let i=0; i<20; i++) {
            const dot = document.createElement('div');
            dot.className = 'glow-point';
            dot.style.left = Math.random() * 100 + 'vw';
            dot.style.animationDelay = Math.random() * 3 + 's';
            pContainer.appendChild(dot);
        }

        const glassBox = document.getElementById('glassBox');
        const ring = document.getElementById('loaderRing');
        const title = document.getElementById('brandTitle');
        const status = document.getElementById('statusText');

        // ၁. စက္ကန့် ၂၅၀၀ ပြည့်ရင် ပုံစံပြောင်းမယ်
        setTimeout(() => {
            glassBox.classList.add('hide-box'); 
            ring.style.opacity = '0';
            status.style.opacity = '0'; 
            
            setTimeout(() => {
                glassBox.style.display = 'none'; 
                ring.style.display = 'none';
                title.classList.add('show-text'); 
                status.innerText = "Welcome to the Future";
                status.style.color = "var(--accent)";
                status.style.opacity = '1';
            }, 600); 
        }, 2500);

        // ၂. စုစုပေါင်း ၅ စက္ကန့်ပြည့်ရင် index.html ကိုသွားမယ်
        setTimeout(() => {
            window.location.href = 'index.html'; 
        }, 5000);
    </script>

</body>
</html>
